name: Update Somalia news

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSS and build news.json
        run: python scripts/fetch_news.py

      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news"
            git push
          fi
